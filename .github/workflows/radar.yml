name: Web3 bounty radar

on:
  schedule:
    # GitHub schedules are best-effort and may be delayed.
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web3-bounty-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Update policy radar
        run: python crawler.py run --discover-paths --alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: GitHub code-search discovery
        # Non-fatal: search is rate-limited and the built-in token may lack access.
        run: |
          if python crawler.py discover-github --pages 1; then
            python crawler.py export
          else
            echo "discovery skipped this run"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit state and exports
        run: |
          git config user.name "web3-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.db exports
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "Update Web3 bounty radar [skip ci]"
            git push
          fi
